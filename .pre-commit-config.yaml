# Git hooks managed by pre-commit (https://pre-commit.com). One-time setup per clone:
#   pre-commit install
# Run on everything: pre-commit run --all-files
# Update pins:       pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2 # uses .markdownlint-cli2.jsonc
        args: [--no-globs] # lint only the files pre-commit passes, not the config's "globs"
