allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.7'
  - '@better-auth/drizzle-adapter@1.7.7'
  - '@better-auth/kysely-adapter@1.7.7'
  - '@better-auth/memory-adapter@1.7.7'
  - '@better-auth/mongo-adapter@1.7.7'
  - '@better-auth/prisma-adapter@1.7.7'
  - '@better-auth/telemetry@1.7.7'
  - better-auth@1.7.7
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - auth@1.7.7
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3
# Aspire's Dockerfile installs on node:24-slim (glibc) but runs on node:24-alpine (musl):
# keep musl builds of native packages (e.g. @takumi-rs/core) in the installed tree.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current, musl]
