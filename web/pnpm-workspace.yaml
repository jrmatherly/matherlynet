allowBuilds:
  esbuild: true
  # Its postinstall only prints a version-scheme warning; nothing to build.
  protobufjs: false
# Aspire's Dockerfile installs on node:24-slim (glibc) but runs on node:24-alpine (musl):
# keep musl builds of native packages (e.g. @takumi-rs/core) in the installed tree.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current, musl]
# pnpm 12 records the packageManager pin as a boot document at the top of pnpm-lock.yaml unless this is `ignore`.
# GitHub's dependency graph does not detect a two-document lockfile, so web/ would get no Dependabot alerts or security
# updates.
# CI and the image still install the pinned version; a local pnpm doesn't switch to it (checked on pnpm 12.16.1).
pmOnFail: ignore
# Advisory fixes no parent accepts yet. Delete an entry once each parent named here accepts the fix or drops the package
# (`npm view <parent> dependencies`; `pnpm why` shows only the overridden version).
overrides:
  # GHSA-67mh-4wv8-2f99: drizzle-kit's @esbuild-kit/core-utils asks for esbuild 0.18.
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  # GHSA-3g3m-2fjr-6pw4: @sentry/bundler-plugins asks for glob 13, gaxios's rimraf for glob 10.
  glob: 14.0.3
  # GHSA-g3hv-75wg-m249: no 10.x patch; eslint, @eslint/config-array, typescript-estree and jsx-a11y-x ask for 10.x.
  minimatch: 11.0.3
