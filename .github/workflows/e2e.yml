name: 🎭 E2E

on:
  pull_request:
    paths:
      - 'web/**'
      - 'apphost.mts'
      - 'aspire.config.json'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-chart.sh'
      - '.github/workflows/e2e.yml'
  workflow_call: # Publish images runs this before pushing (see publish-images.yml)
  workflow_dispatch:

# Suffixed: a called workflow sees the caller's github.workflow, and an identical group would cancel the caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    name: 🎭 Playwright against the Aspire stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟣 Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      # Pinned and checksum-verified (the hash is from the v13.6.0 release's .sha512 asset); bump both together.
      # install.sh does the same download + extract into ~/.aspire/bin, without the pinned hash.
      - name: 🧰 Install Aspire CLI
        env:
          ASPIRE_VERSION: '13.6.0'
          ASPIRE_SHA512: 3e93ddeae51993d687cb9240c99fc944a91ae273c99e99e3199a424a6feb5209aa076290b55fcc84731f37cb470da3c7b37da64b3370584af2ddd6b51128072a
        run: |
          curl -fsSLo "$RUNNER_TEMP/aspire.tgz" "https://github.com/microsoft/aspire/releases/download/v${ASPIRE_VERSION}/aspire-cli-linux-x64-${ASPIRE_VERSION}.tar.gz"
          echo "${ASPIRE_SHA512}  $RUNNER_TEMP/aspire.tgz" | sha512sum -c -
          mkdir -p "$HOME/.aspire/bin" && tar -xzf "$RUNNER_TEMP/aspire.tgz" -C "$HOME/.aspire/bin"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: 📚 Install dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium

      - name: 🔐 Trust the dev certificate
        run: aspire certs trust --non-interactive --nologo

      - name: 🚀 Start the stack
        run: |
          aspire start --non-interactive --nologo
          aspire wait web --non-interactive --nologo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:4321/api/auth/ok

      - name: 🎭 Run E2E
        run: pnpm --dir web e2e

      # aspire start is run mode; publish-only AppHost code (the copy-compose-override step) only runs here.
      - name: 📦 Check publish output
        run: |
          aspire publish -o out/compose --non-interactive --nologo
          test -f out/compose/docker-compose.override.yaml
          WEB_IMAGE=x PG_PASSWORD=x docker compose --project-directory out/compose config | grep -q 'start_period: 1m30s'
          DEPLOY_TARGET=k8s aspire publish -o out/k8s --non-interactive --nologo
          scripts/check-chart.sh out/k8s

      # The runs above have no model URL (the playground's off path); this one points it at the fake model server.
      # The runner keeps a step's background process alive until the job ends.
      - name: 🤖 Restart the stack with the fake model
        run: |
          nohup node web/tests/fake-llama.ts 18080 > "$RUNNER_TEMP/fake-llama.log" 2>&1 &
          aspire stop --non-interactive --nologo
          aspire secret set Parameters:playground-model-url http://127.0.0.1:18080 --non-interactive --nologo
          aspire start --non-interactive --nologo
          aspire wait web --non-interactive --nologo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:4321/api/auth/ok

      # Only live.spec.ts depends on the model; the other specs already ran above.
      - name: 🎭 Run the playground E2E with the model on
        run: pnpm --dir web e2e e2e/live.spec.ts

      - name: 📜 Stack logs
        if: failure()
        run: |
          aspire logs web --non-interactive --nologo || true
          cat "$RUNNER_TEMP/fake-llama.log" 2>/dev/null || true

      - name: 📤 Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
