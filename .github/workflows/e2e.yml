name: 🎭 E2E

on:
  pull_request:
    paths:
      - 'web/**'
      - 'apphost.mts'
      - 'aspire.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'apphost.mts'
      - 'aspire.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    name: 🎭 Playwright against the Aspire stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟣 Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: 🧰 Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.6.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: 📚 Install dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium

      - name: 🔐 Trust the dev certificate
        run: aspire certs trust --non-interactive --nologo

      - name: 🚀 Start the stack
        run: |
          aspire start --non-interactive --nologo
          aspire wait web --non-interactive --nologo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:4321/api/auth/ok

      - name: 🎭 Run E2E
        run: pnpm --dir web e2e

      - name: 📜 Stack logs
        if: failure()
        run: aspire logs web --non-interactive --nologo || true

      - name: 📤 Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
