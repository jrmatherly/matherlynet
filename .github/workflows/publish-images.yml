name: 📦 Publish images

on:
  push:
    branches: [main]
    # Build only when the image or the chart can change: the web app, the AppHost that generates the
    # Dockerfile and the Helm chart, its dependencies/config, or this workflow. Docs and agent config don't.
    # (paths-ignore can't take `!` exceptions, so this is an include list.)
    paths:
      - 'web/**'
      - '!web/README.md'
      - '!web/AGENTS.md'
      - '!web/CLAUDE.md'
      - 'apphost.mts'
      - 'aspire.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.apphost.json'
      - '.github/workflows/publish-images.yml'
      - 'scripts/check-chart.sh'
      # Called from here before pushing; on their own they run only for pull requests and manual dispatch.
      - '.github/workflows/web-checks.yml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch: # manual runs ignore the path filter

# A newer push to the same ref supersedes an in-flight build; cancel it to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Gate the push on the same checks PRs run; a failing commit on main publishes nothing.
  checks:
    name: ✅ Web checks
    permissions:
      contents: read
    uses: ./.github/workflows/web-checks.yml

  e2e:
    name: 🎭 E2E
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  push:
    name: 🚀 Build & push to GHCR
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    outputs:
      image: ghcr.io/${{ github.repository }}/web@${{ steps.digest.outputs.digest }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟣 Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Pinned and checksum-verified (the hash is from the v13.6.0 release's .sha512 asset); bump both together.
      # install.sh does the same download + extract into ~/.aspire/bin, without the pinned hash.
      - name: 🧰 Install Aspire CLI
        env:
          ASPIRE_VERSION: '13.6.0'
          ASPIRE_SHA512: 3e93ddeae51993d687cb9240c99fc944a91ae273c99e99e3199a424a6feb5209aa076290b55fcc84731f37cb470da3c7b37da64b3370584af2ddd6b51128072a
        run: |
          curl -fsSLo "$RUNNER_TEMP/aspire.tgz" "https://github.com/microsoft/aspire/releases/download/v${ASPIRE_VERSION}/aspire-cli-linux-x64-${ASPIRE_VERSION}.tar.gz"
          echo "${ASPIRE_SHA512}  $RUNNER_TEMP/aspire.tgz" | sha512sum -c -
          mkdir -p "$HOME/.aspire/bin" && tar -xzf "$RUNNER_TEMP/aspire.tgz" -C "$HOME/.aspire/bin"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the image push: a chart that can't be generated or fails its checks stops the job with nothing
      # published. helm and yq ship with the runner image.
      - name: ☸️ Generate & check Helm chart
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TARGET: k8s
        run: |
          aspire publish -o out/k8s --non-interactive --nologo
          rm -f out/k8s/*.Dockerfile
          scripts/check-chart.sh out/k8s

      - name: 📤 Hand the chart to the chart job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: out/k8s
          if-no-files-found: error
          retention-days: 1

      # Images go to ghcr.io/jrmatherly/matherlynet/<resource>:<commit sha> (see apphost.mts).
      - name: 🐳 Build & push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: aspire 'do' push --non-interactive # quoted: shellcheck SC1010 reads 'do' as a keyword

      - name: 🔎 Resolve image digest
        id: digest
        # Assigned first: inside echo, a failed inspect would still write an empty digest and the step would pass.
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}/web:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for web:${GITHUB_SHA} (got '${digest}')"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Straight after the push, so nothing that runs later can leave a pushed image unattested.
      # Verify with: gh attestation verify oci://ghcr.io/jrmatherly/matherlynet/web:<sha> -R jrmatherly/matherlynet
      # No storage record: those need an organization-owned repository.
      - name: 🔏 Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/web
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The chart pins the image just pushed by digest, so a chart version is a whole release. It lands at
  # oci://ghcr.io/jrmatherly/matherlynet/charts/matherlynet as 0.<run number>.<run attempt>: SemVer that goes up
  # with every run, and a re-run gets a new version instead of replacing one a cluster may already have pulled.
  # Its own job: a failed chart push can be re-run without rebuilding the image, and can't skip the source maps.
  # main only: a manual run on another branch would otherwise publish unmerged code as the newest version.
  chart:
    name: ☸️ Push Helm chart to GHCR
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: 📥 Download the chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-chart
          path: chart

      - name: ☸️ Pin image, package & push
        env:
          WEB_IMAGE: ${{ needs.push.outputs.image }}
          CHART_VERSION: 0.${{ github.run_number }}.${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$WEB_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::No image digest to pin (got '$WEB_IMAGE')"; exit 1; }
          yq -i '.parameters.web.web_image = strenv(WEB_IMAGE)' chart/values.yaml
          helm package chart --version "$CHART_VERSION" --app-version "$GITHUB_SHA" --destination "$RUNNER_TEMP"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/matherlynet-$CHART_VERSION.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY/charts"

  # Separate job: the third-party CLI and SENTRY_AUTH_TOKEN never share a runner with packages: write or
  # id-token: write. No token scopes at all: the web image package is public, so the pull is anonymous.
  sourcemaps:
    name: 🗺️ Upload source maps to Sentry
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Uploads the maps from the pushed image itself (pulled by digest, so exactly the attested bytes) and the
      # debug IDs match the code that runs. --no-rewrite: the CLI would otherwise add debug IDs to the few chunks
      # without one, and those copies wouldn't match.
      # Skipped until the SENTRY_AUTH_TOKEN secret (a Sentry organization auth token) exists.
      - name: 🗺️ Upload source maps to Sentry
        env:
          IMAGE: ${{ needs.push.outputs.image }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: matherlynet
          SENTRY_PROJECT: javascript-astro
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "::warning::SENTRY_AUTH_TOKEN not set; skipping source map upload (this release's stack traces stay minified)"; exit 0; fi
          docker pull --quiet "$IMAGE"
          container=$(docker create "$IMAGE")
          docker cp "$container:/app/dist" "$RUNNER_TEMP/dist"
          docker rm "$container"
          npx --yes sentry@0.45.0 release create "$SENTRY_ORG/$GITHUB_SHA" --project "$SENTRY_PROJECT" --finalize
          npx --yes sentry@0.45.0 sourcemap upload "$RUNNER_TEMP/dist" --release "$GITHUB_SHA" --no-rewrite
