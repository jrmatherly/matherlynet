name: 📦 Publish images

on:
  push:
    branches: [main]
    # Build only when the image can change: the web app, the AppHost that generates the
    # Dockerfile, its dependencies/config, or this workflow. Docs and agent config don't.
    # (paths-ignore can't take `!` exceptions, so this is an include list.)
    paths:
      - 'web/**'
      - '!web/README.md'
      - '!web/AGENTS.md'
      - '!web/CLAUDE.md'
      - 'apphost.mts'
      - 'aspire.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.apphost.json'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch: # manual runs ignore the path filter

# A newer push to the same ref supersedes an in-flight build; cancel it to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  push:
    name: 🚀 Build & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟣 Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 🧰 Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.6.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images go to ghcr.io/jrmatherly/matherlynet/<resource>:<commit sha> (see apphost.mts).
      - name: 🐳 Build & push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: aspire 'do' push --non-interactive # quoted: shellcheck SC1010 reads 'do' as a keyword

      - name: 🔎 Resolve image digest
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}/web:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      # Verify with: gh attestation verify oci://ghcr.io/jrmatherly/matherlynet/web:<sha> -R jrmatherly/matherlynet
      # No storage record: those need an organization-owned repository.
      - name: 🔏 Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/web
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
