name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.6.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds web's image and pushes it to ghcr.io/jrmatherly/matherlynet (see apphost.mts).
      - run: aspire 'do' push --non-interactive   # quoted: shellcheck SC1010 reads 'do' as a keyword
