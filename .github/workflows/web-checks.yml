name: ✅ Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-checks.yml'
  workflow_call: # Publish images runs this before pushing (see publish-images.yml)
  workflow_dispatch:

# Suffixed: a called workflow sees the caller's github.workflow, and an identical group would cancel the caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-web-checks
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: 🔎 Check, lint, test & build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Version comes from web/package.json "packageManager".
      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Astro check
        run: pnpm check

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🧪 Test
        run: pnpm test

      # The build needs no database; migrations run only at container start.
      - name: 🏗️ Build
        run: pnpm build

      # E2E runs the dev server. This runs the production server half (server.mjs, without start.mjs's migrations;
      # e2e.yml's image smoke runs the real entry against a database). With the database
      # unreachable and better-auth's production rate limiter on: probes still answer, Astro's origin check accepts
      # a same-origin form POST forwarded as HTTPS (allowedDomains) and rejects a cross-site one, and SIGTERM drains
      # and exits 0 inside Docker's 10 s stop timeout.
      - name: 🚦 Smoke-test the production server
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '4321'
          BETTER_AUTH_URL: https://matherly.net
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
          APPDB_URI: postgresql://ci:ci@127.0.0.1:1/appdb
        run: |
          set -euo pipefail
          node --import ./otel.mjs server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$PORT/api/auth/ok" > /dev/null 2>&1 && break; sleep 1; done
          expect() { # expect <status> <curl args...>
            local want=$1; shift
            local got; got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            echo "$got $*"; [ "$got" = "$want" ] || { echo "::error::expected $want, got $got: $*"; exit 1; }
          }
          expect 200 "http://127.0.0.1:$PORT/api/auth/ok"
          expect 200 "http://127.0.0.1:$PORT/api/auth/ok?probe=liveness"
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: matherly.net' -H 'X-Forwarded-Proto: https' \
            -H "Origin: $1" -H 'Content-Type: application/x-www-form-urlencoded' --data 'action=revoke-others' \
            "http://127.0.0.1:$PORT/account"; }
          same=$(post https://matherly.net); echo "same-origin POST: $same"
          [ "$same" != 403 ] || { echo "::error::same-origin POST rejected (origin check vs X-Forwarded-Proto)"; exit 1; }
          cross=$(post https://evil.example); echo "cross-origin POST: $cross"
          [ "$cross" = 403 ] || { echo "::error::cross-origin POST not rejected"; exit 1; }
          # /api/playground streams through the adapter: with no database there is no row, so the call is refused at
          # Rate limits and not logged, inside the pool's 5 s connect timeout.
          playground="http://127.0.0.1:$PORT/api/playground"
          proxied=(-X POST -H 'Host: matherly.net' -H 'X-Forwarded-Proto: https')
          stream=$(curl -s -m 10 -w '\n%{http_code} %{content_type}' "${proxied[@]}" -H 'Origin: https://matherly.net' \
            --data-urlencode 'text=hello' --data-urlencode 'caller=End users' "$playground")
          echo "$stream"
          frames=$(grep '^data: ' <<<"$stream")
          if ! { [ "$(tail -n1 <<<"$stream")" = '200 text/event-stream' ] \
            && grep -q '"why":"unavailable"' <<<"$(tail -n2 <<<"$frames" | head -n1)" \
            && grep -q '"type":"end".*"logged":false' <<<"$(tail -n1 <<<"$frames")"; }; then
            echo "::error::playground stream did not end unavailable and unlogged"; exit 1
          fi
          expect 415 "${proxied[@]}" -H 'Origin: https://matherly.net' -H 'Content-Type: application/json' --data '{}' "$playground"
          expect 403 "${proxied[@]}" -H 'Origin: https://evil.example' --data 'text=hello&caller=End+users' "$playground"
          kill -TERM "$pid"
          start=$SECONDS; status=0; wait "$pid" || status=$?
          trap - EXIT
          echo "exit $status after $((SECONDS - start)) s"
          [ "$status" = 0 ] && [ $((SECONDS - start)) -le 10 ]
